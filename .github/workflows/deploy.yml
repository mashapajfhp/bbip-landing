# ─────────────────────────────────────────────────────────────────────────────
# GitHub Actions deploy workflow
#
# Builds and tests BBIP Landing on GitHub-hosted runners, then deploys to the
# production server over SSH.
#
# ── Prerequisites ─────────────────────────────────────────────────────────────
#   - Run `ansible-playbook playbooks/onboard_docker.yml` to provision project
#   - Configure the production deployment script on the target server
#
# ── Required GitHub Actions Secrets (Settings → Secrets → Actions) ───────────
#   DEPLOY_SSH_KEY — Private SSH key used for deployment
#   DEPLOY_HOST    — Production server hostname or IP address
#   DEPLOY_USER    — Production server SSH user
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy

on:
  push:
    branches: [dev, main]

env:
  PROJECT_NAME: bbipsystem # ← Change to match your project slug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Security & Quality ──────────────────────────────────────────────────
  security:
    name: Security & quality checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, json, mbstring

      - name: Create Laravel cache directories
        run: mkdir -p bootstrap/cache storage/logs

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Checks all composer packages against the PHP Security Advisories DB.
      # Fails on any package with a known CVE so a vulnerable dep never ships.
      - name: Audit dependencies for CVEs
        run: composer audit --no-dev

      # Basic Blade template syntax check
      - name: Lint Blade templates
        run: find resources/views -name "*.blade.php" -exec php -l {} \;

      # Check for common debugging code
      - name: Check for debug code
        run: |
          if grep -rE "^\s*dd\(" app resources --include="*.php"; then
            echo "Found dd() debugging code"
            exit 1
          fi
          if grep -rE "^\s*var_dump\(" app resources --include="*.php"; then
            echo "Found var_dump() debugging code"
            exit 1
          fi

  # ── 2. Test ────────────────────────────────────────────────────────────────
  test:
    name: Build & test
    runs-on: ubuntu-latest
    needs: security

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, json, mbstring

      - name: Create Laravel cache directories
        run: mkdir -p bootstrap/cache storage/logs

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Node and build frontend
        run: |
          npm ci
          npm run build

      - name: Verify assets built
        run: |
          if [ ! -d "public/build" ]; then
            echo "Frontend build failed - public/build not found"
            exit 1
          fi

  # ── 3. Deploy ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history required by Gitleaks

      # Scans commits in this push for secrets: API keys, tokens, connection strings.
      # Pinned version + handles the first-push edge case (all-zeros before SHA).
      - name: Scan for leaked secrets (Gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            ./gitleaks detect --source . --redact --log-opts "-1"
          else
            ./gitleaks detect --source . --redact --log-opts "$BEFORE..${{ github.sha }}"
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_bbipsystem
          chmod 600 ~/.ssh/deploy_bbipsystem
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Trigger deployment
        run: |
          ssh -i ~/.ssh/deploy_bbipsystem ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            /usr/local/bin/deploy-${{ env.PROJECT_NAME }}.sh
