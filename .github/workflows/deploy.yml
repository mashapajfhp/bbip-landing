name: Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

permissions:
  contents: read

env:
  PROJECT_NAME: bbipsystem
  IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/bbipsystem

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository for secrets
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, json, mbstring
          coverage: none

      - name: Install and audit PHP dependencies
        run: |
          mkdir -p bootstrap/cache storage/framework/{cache/data,sessions,testing,views} storage/logs
          composer install --no-interaction --prefer-dist --no-progress
          composer audit --no-dev

      - name: Run tests
        run: |
          cp .env.example .env
          php artisan key:generate
          vendor/bin/phpunit

      - name: Build frontend
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: |
          npm ci
          npm run build

  publish:
    name: Build, scan, and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    if: github.event_name == 'push'
    environment: production
    outputs:
      image_ref: ${{ steps.push.outputs.image_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag "$IMAGE:$GITHUB_SHA" .

      # This fails the workflow before Docker Hub credentials are loaded.
      - name: Scan image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        id: push
        run: |
          set -euo pipefail
          docker push "$IMAGE:$GITHUB_SHA"

          image_ref="$(docker inspect \
            --format='{{index .RepoDigests 0}}' \
            "$IMAGE:$GITHUB_SHA")"

          if [[ "$image_ref" != *@sha256:* ]]; then
            echo "Unable to determine pushed image digest." >&2
            exit 1
          fi

          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: publish
    environment: production

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Deploy image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/deploy_key" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "/usr/local/bin/deploy-${PROJECT_NAME}.sh '$IMAGE_REF' '$GITHUB_SHA'"
